[package]
name = "fin-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "REST API for the personal finance tracker"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["query"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
